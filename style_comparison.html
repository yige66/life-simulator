<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Comparison - Ornate Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: #1A0B2E;
            color: #F5F5F7;
            padding: 2rem;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 183, 197, 0.2);
        }
        
        /* Style 1: Magic Circle */
        .magic-stat {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .magic-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(255, 183, 197, 0.4);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Style 2: Modern Border */
        .modern-panel {
            border: 1px solid rgba(255, 183, 197, 0.3);
            position: relative;
            padding: 1.5rem;
        }
        .modern-panel::before, .modern-panel::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border-color: #FFB7C5;
            border-style: solid;
        }
        .modern-panel::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
        .modern-panel::after { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

        /* Style 3: Classical Frame */
        .classical-frame {
            border-radius: 40px 10px 40px 10px;
            border: 4px double rgba(255, 183, 197, 0.5);
            padding: 1.5rem;
            background: linear-gradient(rgba(46, 7, 63, 0.8), rgba(26, 11, 46, 0.8));
        }
    </style>
</head>
<body class="space-y-12">
    <h1 class="text-3xl font-bold text-center text-pink-200 mb-8">华丽装饰派布局方案对比</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Option 1 -->
        <div class="flex flex-col items-center space-y-4">
            <h2 class="text-xl font-bold text-pink-300">1. 幻想魔法阵</h2>
            <div class="magic-stat">
                <div class="magic-circle"></div>
                <div class="text-center">
                    <div class="text-xs opacity-60">智力</div>
                    <div class="text-2xl font-bold">8</div>
                </div>
            </div>
            <p class="text-xs text-center opacity-70">属性以法阵形式排列，按钮带符文动效</p>
        </div>

        <!-- Option 2 -->
        <div class="flex flex-col items-center space-y-4">
            <h2 class="text-xl font-bold text-pink-300">2. 现代极光边框</h2>
            <div class="modern-panel w-48 h-32 flex items-center justify-center glass">
                <div class="text-center">
                    <div class="text-sm">对话内容展示...</div>
                </div>
            </div>
            <p class="text-xs text-center opacity-70">纤细边框与几何护角，极具现代感</p>
        </div>

        <!-- Option 3 -->
        <div class="flex flex-col items-center space-y-4">
            <h2 class="text-xl font-bold text-pink-300">3. 古典画框</h2>
            <div class="classical-frame w-48 h-32 flex items-center justify-center">
                <div class="text-center italic">
                    <div class="text-sm">曾经有一段故事...</div>
                </div>
            </div>
            <p class="text-xs text-center opacity-70">弧形大边缘与双线装饰，浪漫古典</p>
        </div>
    </div>

    <div class="bg-pink-500/10 p-6 rounded-xl border border-pink-500/20 text-center">
        <p class="text-pink-100">你可以选择其中一种，或者让我将它们结合起来。</p>
    </div>
</body>
</html>
